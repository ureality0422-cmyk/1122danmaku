<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#d9f4df"><title>みぃラスラン弾幕</title><style>
:root{font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#214a36;background:#f5fbf5}*{box-sizing:border-box}body{margin:0}.wrap{max-width:850px;margin:auto;padding:18px 14px 90px}header{background:linear-gradient(130deg,#c6f1d1,#e8fff0);padding:24px 18px;border-radius:24px;text-align:center}h1{font-size:clamp(23px,6vw,34px);margin:0 0 8px}header p{margin:0;font-size:13px}.tabs{display:flex;gap:8px;overflow-x:auto;position:sticky;top:0;background:#f5fbf5;padding:12px 0;z-index:2;scrollbar-width:thin}.tab{flex:none;border:1px solid #b9dfc4;background:white;color:#326b49;border-radius:999px;padding:12px 16px;font-weight:700;cursor:pointer}.tab.active{background:#26864f;color:white;border-color:#26864f}h2{font-size:21px;margin:20px 0 14px}.hint{font-size:13px;color:#557260;margin-bottom:16px}.group{background:white;border:1px solid #dcefe1;border-radius:18px;padding:16px;margin:12px 0}.group h3{margin:0 0 12px;font-size:16px}.song-part{padding:14px 0;border-top:1px solid #dcefe1}.song-part:first-of-type{border-top:0;padding-top:0}.part-title{font-size:14px;color:#377450;margin:0 0 10px}.copy{width:100%;background:#f2fbf4;border:1px solid #c9e8d2;border-radius:14px;padding:16px 12px;color:#1b4730;text-align:center;overflow-wrap:anywhere;font-size:16px;line-height:1.8;cursor:pointer;margin:7px 0;min-height:60px}.copy:active{background:#d1f0dc}.copy:focus-visible,.tab:focus-visible{outline:3px solid #2e8b57;outline-offset:2px}.lyrics{white-space:pre-line;background:#f8faf8;border-left:3px solid #b4d9c1;border-radius:6px;padding:12px;margin:12px 0;font-size:14px;line-height:1.9}.note{font-size:12px;color:#5d7968;margin:8px 0 4px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#215f3c;color:white;padding:12px 24px;border-radius:30px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}.toast.show{opacity:1}.empty{padding:30px;text-align:center;color:#647d6b}footer{text-align:center;color:#64806c;font-size:12px;margin-top:30px}</style></head><body><div class="wrap"><header><h1>👑💚 みぃラスラン弾幕 🕊️</h1><p>タップするだけでコピー！ 配信中のコールをもっと簡単に ✨</p></header><nav class="tabs" id="tabs" aria-label="カテゴリ"></nav><main id="content"></main><footer>みぃラスラン弾幕コピー</footer></div><div id="toast" class="toast" role="status" aria-live="polite">コピーしました！</div><script>
const categories=[
{name:'常用',groups:[{title:'常用',items:['👑💚🕊️✨💚 みぃしか勝たん 💚✨🕊️💚👑','🕊•*•.¸¸♬︎🍵•*•.¸¸♬︎🐾•*•.¸¸♬︎🐾•*•.¸¸♬︎🍵']},{title:'アイドル曲常用',items:['꒰ঌ໒꒱ みぃの！歌声に恋してるっ！']}]},
{name:'各曲',groups:[{title:'① フィナーレ',items:['✺⋆*✺⋆*˗ˋˏ❊ˎˊ˗ ⋆̩̣*̩⋆̩̣*̩⋆⭐️̩*̣̩⋆̩̣*̩⋆̩ ˗ˋˏ❊ˎˊ˗✺⋆*✺⋆*']},{title:'② ファンサ',items:['や・く・そ・くぅぅぅぅ！！！！！','(っ/ ॑꒳ ॑ )っ行くよぉおおおお！！！','ずっと！','(」ﾟДﾟ)」＜L！O！V！E！','もっと！','ファンサしちゃうぞ(･ω<)','＼＼Foooooooo!!!!!!!!／／']},{title:'③ おまえも♡',items:['＼ﾅﾝﾂｯﾃ!‪／',"(o🪄'▽')o🪄 おれもーーーーー！",'(/・ω・)/にゃー!']},{title:'④ 最強の推し！',parts:[{title:'冒頭〜間奏',lyrics:'あなたの存在が世界を照らしてくの\n巡り逢えた\nあなたは私にとって最強の推し',note:'間奏中コール',items:['(o🪄˙˘˙)o🪄 ハイ！ハイ！ハイ！']},
{title:'① Aメロ',lyrics:'あなたのいない毎日じゃ私は正直生きてけない\n世知辛い社会に飲まれないための心の安定剤\n全治全能 効くって万病',note:'歌詞と同時にコール',items:['📣 ((*｣´∀`)｣ 全知全能！効くって万病！']},
{title:'① Bメロ',lyrics:'天にまします 私の推し様\n永遠をここに誓いましょう\n病める時も 健やかなる時も\nOoh Ooh Ooh',note:'歌詞と同時にコール',items:['٩(ˊᗜˋ*)و Ooh！Ooh！Ooh！']},
{title:'② 1番サビ',note:'1番サビは通常弾幕。サビ終わりの間奏でコール',items:['(o🪄˙˘˙)o🪄 ハイ！ハイ！ハイ！']},
{title:'② 2番 Aメロ',lyrics:'確かに側から見たなら私は正気の沙汰ではない\nだけど人生を賭けるだけの価値があるから仕方がない\n心配ご無用 至って正常',note:'歌詞と同時にコール',items:['((*｣´∀`)｣ 心配ご無用！至って正常！']},
{title:'② 2番 Bメロ',lyrics:'自分の「好き」は自分で守る\nこれが私の曲げないルール\nたとえ誰かに何を言われても\nOoh Ooh Ooh',note:'歌詞と同時にコール',items:['٩(ˊᗜˋ*)و Ooh！Ooh！Ooh！']},
{title:'③ 2番サビ〜間奏',note:'2番サビは通常弾幕。間奏でコール',items:['(o🪄˙˘˙)o🪄 ハイ！ハイ！ハイ！']},
{title:'③ ラスサビ',note:'ラスサビは通常弾幕。「さあ！」に合わせてラストコール',items:['さあ！ (٩(ˊᗜˋ*)و さあ！！) 永遠を誓いましょう','さあ！ (٩(ˊᗜˋ*)و さあ！！) 至高の愛と共に','さあ！ (٩(ˊᗜˋ*)و さあ！！) 永遠を誓いましょう']}]},
{title:'⑤ ハートブーケ',items:['٩( ᐛ )و うぉっおー！うぉっおー！٩( ᐖ )و']}]}
];
let selected=0;const tabs=document.getElementById('tabs'),content=document.getElementById('content'),toast=document.getElementById('toast');let toastTimer;
function node(tag,className,text){const el=document.createElement(tag);if(className)el.className=className;if(text!==undefined)el.textContent=text;return el}
function render(){tabs.replaceChildren();categories.forEach((category,index)=>{const button=node('button','tab'+(index===selected?' active':''),category.name);button.type='button';button.setAttribute('aria-pressed',String(index===selected));button.onclick=()=>{selected=index;render();window.scrollTo({top:0,behavior:'smooth'})};tabs.append(button)});content.replaceChildren(node('h2','',categories[selected].name),node('p','hint','弾幕をタップするとコピーできます'));categories[selected].groups.forEach(group=>{const section=node('section','group');section.append(node('h3','',group.title));const renderPart=(part,target)=>{if(part.title)target.append(node('h4','part-title',part.title));if(part.lyrics)target.append(node('div','lyrics',part.lyrics));if(part.note)target.append(node('p','note',part.note));(part.items||[]).forEach(value=>{const button=node('button','copy',value);button.type='button';button.title='タップしてコピー';button.onclick=()=>copyText(value);target.append(button)})};if(group.parts){group.parts.forEach((part,index)=>{const block=node('div','song-part');renderPart(part,block);section.append(block)})}else{renderPart(group,section)}content.append(section)})}
async function copyText(value){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(value)}else{const field=document.createElement('textarea');field.value=value;field.style.position='fixed';field.style.opacity='0';document.body.append(field);field.select();const success=document.execCommand('copy');field.remove();if(!success)throw Error('copy failed')}toast.textContent='コピーしました！'}catch(error){toast.textContent='コピーできませんでした。HTTPSで開いてください。'}toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}render();
</script></body></html>
